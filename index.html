<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia - Ley de la Conservación de la Materia</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;margin:0;display:flex;justify-content:center}
#app{max-width:760px;width:95%;background:#fff;margin:30px;padding:20px;border-radius:12px}
h1{text-align:center;color:#1e3a8a}
#progress{height:16px;background:#ddd;border-radius:8px;overflow:hidden}
#bar{height:100%;width:0;background:#22c55e}
button.opt{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:8px;background:#e5e7eb;cursor:pointer}
button.opt:hover{background:#bfdbfe}
.correct{background:#22c55e!important;color:#fff}
.incorrect{background:#ef4444!important;color:#fff}
#next{display:none;margin-top:15px;padding:10px 18px}
</style>
</head>
<body>
<div id="app">
<h1>🧪 Trivia: Ley de la Conservación de la Materia</h1>
<div id="progress"><div id="bar"></div></div>
<p id="num"></p>
<h3 id="q"></h3>
<div id="opts"></div>
<button id="next">Siguiente</button>
<p id="result"></p>
</div>
<script>
const quiz=[
{q:"¿Quién formuló la Ley de la Conservación de la Materia?",a:[
["Antoine Lavoisier",1],["John Dalton",0],["Isaac Newton",0],["Niels Bohr",0]]},
{q:"La ley establece que...",a:[
["La materia no se crea ni se destruye, solo se transforma.",1],["La materia desaparece.",0],["La materia se crea.",0],["La masa cambia siempre.",0]]},
{q:"La masa de los reactivos es...",a:[
["Igual a la de los productos.",1],["Mayor",0],["Menor",0],["Variable",0]]},
{q:"¿Por qué se balancean las ecuaciones?",a:[
["Para conservar el número de átomos.",1],["Para cambiar fórmulas.",0],["Para crear materia.",0],["Para hacerlas más cortas.",0]]},
{q:"¿Cuál es una reacción química?",a:[
["Quemar madera",1],["Romper vidrio",0],["Cortar papel",0],["Derretir hielo",0]]},
{q:"¿Qué sucede con los átomos?",a:[
["Se reorganizan.",1],["Desaparecen",0],["Se destruyen",0],["Se crean",0]]},
{q:"¿Quién es el padre de la química moderna?",a:[
["Antoine Lavoisier",1],["Rutherford",0],["Bohr",0],["Thomson",0]]},
{q:"Objetivo del balanceo:",a:[
["Igualar átomos en ambos lados.",1],["Cambiar productos",0],["Crear masa",0],["Eliminar reactivos",0]]},
{q:"La ley es importante porque...",a:[
["Permite cálculos correctos.",1],["Aumenta la masa",0],["Destruye átomos",0],["Cambia elementos",0]]},
{q:"Durante una reacción la materia...",a:[
["Se transforma.",1],["Desaparece",0],["Se crea",0],["Se reduce a energía",0]]},
{q:"Los reactivos son...",a:[
["Sustancias iniciales.",1],["Productos finales",0],["Catalizadores",0],["Desechos",0]]},
{q:"Los productos son...",a:[
["Sustancias formadas.",1],["Reactivos",0],["Átomos",0],["Elementos",0]]},
{q:"Una ecuación no balanceada...",a:[
["No representa correctamente la reacción.",1],["Es correcta siempre",0],["Tiene más productos",0],["No contiene átomos",0]]},
{q:"La combustión es ejemplo de...",a:[
["Reacción química",1],["Cambio físico",0],["Mezcla",0],["Elemento",0]]},
{q:"¿Qué se conserva en una reacción química?",a:[
["La masa total",1],["El volumen",0],["El color",0],["La temperatura",0]]}
];
let i=0,s=0;
const q=document.getElementById('q'),opts=document.getElementById('opts'),num=document.getElementById('num'),bar=document.getElementById('bar'),next=document.getElementById('next'),res=document.getElementById('result');
function shuffle(x){return x.sort(()=>Math.random()-0.5)}
function load(){
bar.style.width=(i/quiz.length*100)+'%';num.textContent=`Pregunta ${i+1} de ${quiz.length}`;q.textContent=quiz[i].q;opts.innerHTML='';next.style.display='none';
shuffle([...quiz[i].a]).forEach(v=>{
let b=document.createElement('button');b.className='opt';b.textContent=v[0];
b.onclick=()=>{
[...opts.children].forEach(x=>x.disabled=true);
if(v[1]){b.classList.add('correct');s++;}else{b.classList.add('incorrect');[...opts.children].find(x=>quiz[i].a.find(y=>y[0]==x.textContent&&y[1]))?.classList.add('correct');}
next.style.display='inline-block';
};
opts.appendChild(b);
});
}
next.onclick=()=>{i++; if(i<quiz.length)load(); else{bar.style.width='100%';q.textContent='¡Trivia finalizada!';opts.innerHTML='';next.style.display='none';num.textContent='';res.innerHTML=`Obtuviste <b>${s}</b> de <b>${quiz.length}</b> respuestas correctas.<br><br><button onclick="location.reload()">Jugar nuevamente</button>`;}};
load();
</script>
</body></html>
