<!DOCTYPE html>
<html lang="es">
<head>

    .contenedor{
        background:white;

    }

        color:#1d4ed8;

        display:block;

<body>

<div class="contenedor">

<h1>🧪 Trivia de Química</h1>

<div id="quiz">

    <div class="pregunta" id="pregunta"></div>

    <div id="opciones"></div>

</div>

<div id="resultado"></div>

</div>

<script>

const preguntas = [

{
pregunta: "¿Cuál es el estado de la materia con forma y volumen definidos?",
opciones: ["Líquido", "Gas", "Sólido", "Plasma"],
respuesta: "Sólido"
},

{
pregunta: "¿Qué método se utiliza para separar arena y agua?",
opciones: ["Destilación", "Filtración", "Evaporación", "Imantación"],
respuesta: "Filtración"
},

{
pregunta: "¿Cuál estado de la materia no tiene forma fija pero sí volumen fijo?",
opciones: ["Gas", "Líquido", "Plasma", "Sólido"],
respuesta: "Líquido"
},

{
pregunta: "¿Qué método separa líquidos con diferentes puntos de ebullición?",
opciones: ["Decantación", "Tamizado", "Destilación", "Filtración"],
respuesta: "Destilación"
},

{
pregunta: "¿Qué estado de la materia se expande completamente?",
opciones: ["Gas", "Sólido", "Líquido", "Plasma"],
respuesta: "Gas"
},

{
pregunta: "¿Qué método se usa para separar hierro y arena?",
opciones: ["Imantación", "Filtración", "Destilación", "Evaporación"],
respuesta: "Imantación"
}

];
